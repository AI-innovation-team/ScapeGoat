name: CodeQL

# Code scanning is free on public repositories. Were this repo to go private
# again it would need GitHub Advanced Security — drop back to workflow_dispatch
# alone at that point, or every run fails on the upload step.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Catches newly published advisories against code that has not changed.
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the top-level one rather than extending it,
      # so checkout's `contents: read` has to be restated here.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python  # Add c-cpp, go, java-kotlin, or swift if needed
          build-mode: none   # Switch to autobuild for compiled languages
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
